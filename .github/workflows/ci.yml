name: CI
# `push` is deliberately narrow. With `branches: ["**"]` a branch that has an
# open pull request runs the whole matrix twice for one commit — once for the
# push and once for the pull request — which is what the first run of this
# workflow did: four checks for two platforms. Work on a branch is covered by
# the pull request; `main` is covered here, so every commit is checked exactly
# once and nothing goes unchecked.
on:
  push:
    branches: [main]
  pull_request:

# Third-party actions are pinned by commit SHA, with the version they were at in
# a trailing comment. A tag is a movable pointer: whoever controls the action can
# repoint `@v4` at a different commit, and this workflow would run it on the next
# push without a diff anywhere in this repository. That is tolerable while a
# repository is private and its runs are its owner's; it is a supply-chain step on
# a public one, where the same workflow also runs against pull requests.
#
# Pinning is what makes the version legible, so it is bumped rather than frozen:
# checkout and upload-artifact go v4 -> v7.0.1 here, which also retires the Node 20
# deprecation warning v4 had started printing. The comment is the only thing that
# says which version a SHA is, so it has to be updated with it.
#
# Read-only for every job, declared once at the top so a new job cannot inherit
# more by being written without a `permissions:` block. Nothing here needs to
# write to the repository: the bundle job uploads an artefact, which is a
# different scope, and a token that may push is one supply-chain step away from
# a workflow that does.
permissions:
  contents: read

jobs:
  check:
    # Two platforms, not because the product ships on two — v1 is macOS — but
    # because the crate list in §8 of the architecture spec was assembled from
    # documentation, and a list that compiles on exactly one target has been
    # checked against almost nothing. Linux is where Tauri is known to be
    # weakest: it builds against a packaged WebKitGTK rather than an OS
    # component, and that is the seam that breaks.
    strategy:
      # Both arms always report. With fail-fast the first failure cancels the
      # other arm, and these two are meant to fail for unrelated reasons —
      # cancelling one hides a second, independent break behind whichever
      # happened to finish first.
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Measured, not guessed: across the last three green runs this job took
    # 1.5–3.2 minutes end to end, and its longest single step — installing the
    # Linux system libraries — ran in 51 s. Fifteen is roughly five times the
    # slowest observed run, which is margin for a cold cache rather than a
    # budget anyone should be near.
    #
    # The number exists because of what happens without it. On 2026-07-29 that
    # same 51-second `apt-get` hung on a runner, on a commit that touched one
    # markdown file, minutes after the identical step had passed. With no limit
    # declared, GitHub's default applies and a hung step holds a runner for
    # **six hours** before anything says so — burning billed minutes and, worse,
    # reporting nothing at all in the meantime. A wedged job that never
    # concludes is not a slow job; it is a job with no result.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain action on purpose: rust-toolchain.toml is the single place
      # the version and its components are named, and rustup (preinstalled on
      # the runner) provisions exactly that. A second declaration here would
      # drift from it silently.
      - name: Provision the toolchain named in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # macOS gets WebKit from the OS; on Linux it is a package, and without its
      # headers the `tauri` crate does not build at all. librsvg and patchelf
      # belong to the bundler rather than to the library — they are here so that
      # a Linux bundle, if one is ever wanted, does not need a second list that
      # nobody remembers to keep in step with this one.
      #
      # Measured in an ubuntu:24.04 container rather than assumed, including the
      # negative control: with libwebkit2gtk-4.1-dev removed the build stops in
      # `webkit2gtk-sys`, on pkg-config failing to find `webkit2gtk-4.1`.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      # `bundle.externalBin` in tauri.conf.json names a file that has to exist
      # before `src-tauri` compiles at all — `tauri-build` validates it from
      # inside the build script, not at bundling time. The two `before*Command`
      # hooks stage it, but they fire only for `cargo tauri dev` and
      # `cargo tauri build`; every command in this job is plain cargo, which has
      # no hooks. And `src-tauri/binaries/` is git-ignored on purpose — a
      # committed sidecar could ship stale inside a green build — so on a fresh
      # checkout the file is absent.
      #
      # Deleting this step therefore does not skip a check; it stops the build:
      #
      #   error: failed to run custom build command for `mnema-desktop v0.0.0`
      #     resource path `binaries/mnema-extract-worker-<triple>` doesn't exist
      #
      # Both the clippy step (`scripts/lint.sh`) and `cargo test --workspace`
      # below end there, on both matrix arms. Measured by moving the staged file
      # aside and watching `cargo check -p mnema-desktop` fail, then pass — not
      # predicted from the configuration.
      #
      # `bundle` and `mutations` stage the sidecar themselves, for the same
      # reason and by the same script. They used to be reached only through this
      # job (`needs: check`) and so could once have been read as inheriting it;
      # they no longer declare it — every job now starts from a bare checkout and
      # provisions what it needs.
      #
      # `debug`, not `release`. `tauri-build` only checks that the declared file
      # exists — it does not care which profile produced it — and every other
      # command in this job is dev profile. Asking for `release` here would
      # compile mnema-extract and its dependency tree, pdfium-render included, a
      # second time on both arms for a file whose contents this job never runs.
      # The bundle job still stages `release`, through beforeBuildCommand, which
      # is where the profile actually matters.
      #
      # What it buys beyond unblocking: this is the only place the staging script
      # runs on Linux. It derives the filename suffix from `rustc -vV` on the
      # machine it runs on, so `aarch64-apple-darwin` and `x86_64-unknown-linux-gnu`
      # are both exercised here rather than only on whichever laptop last built a
      # package.
      - name: Stage the extraction worker that src-tauri declares as a sidecar
        run: scripts/stage-sidecar.sh debug
      - run: cargo fmt --all -- --check
      # The second file `src-tauri` will not compile without, and it became one
      # the day the bundle started shipping Pdfium: `bundle.resources` names the
      # vendored library, and `tauri-build` validates resources from inside the
      # build script exactly the way it validates `externalBin` above. Measured
      # the same way, by moving `vendor/pdfium` aside and running
      # `cargo build -p mnema-desktop`:
      #
      #   resource path `../vendor/pdfium/lib/libpdfium.dylib` doesn't exist
      #
      # Which library that is depends on the arm. The name is not written here
      # because it is not one name: `tauri.linux.conf.json` swaps the macOS
      # `.dylib` for the `.so` this step installs on Linux, and the first Linux
      # run this branch ever completed failed on exactly that — the declaration
      # named one platform's file while this script produced another's.
      # `src-tauri/tests/vendored_library_resource.rs` now holds the two in step
      # from any host, so the next one does not wait for a runner.
      #
      # So it sits above clippy rather than below it. The reason it used to sit
      # below — fmt and clippy do not need the library, and reporting a stray
      # newline should not cost a 7.7 MB download — survives only for fmt, which
      # compiles nothing and still runs first.
      - name: Vendor the pinned Pdfium build, which src-tauri now needs to compile
        run: scripts/fetch-pdfium.sh
      # 🔴 `scripts/lint.sh`, not `cargo clippy` directly, and the reason is
      # measured. Clippy and `cargo test` compile the same crates with different
      # rustc invocations, so sharing one `CARGO_TARGET_DIR` makes each
      # invalidate what the other just built — and this job runs both. The
      # script gives clippy `target/clippy` of its own; the lint is identical,
      # `-D warnings` included.
      #
      # This step was first left alone on the belief that every CI job starts
      # cold, which would have made the second build free to give up. That is
      # false: `Swatinem/rust-cache` above restores `target/` between runs, so
      # this job was paying the same double build the local gate was. Measured
      # locally on a fully built tree: clippy 172s -> 2s, and the
      # `cargo test --workspace` after it 1783s -> 492s.
      - run: scripts/lint.sh
      # The Svelte frontend's own gate: it builds and runs its unit tests here.
      # Gated to one leg of the matrix, the reasoning the old vanilla suite gave
      # and it still holds — this is plain TypeScript and JS with nothing
      # OS-specific in it, so running it on both platforms would only double the
      # cost for the same answer, the mirror of the keychain step below (macOS
      # only, because the binding it tests is macOS-only).
      #
      # It is NOT here because `src-tauri` needs the build output to compile — it
      # does not. `generate_context!` embeds `frontendDist` (../ui/dist), but a
      # missing directory is not a compile error on tauri 2.x: measured, with
      # ui/dist moved aside, `cargo check`/`clippy`/`build -p mnema-desktop` all
      # succeed, debug and release, with no warning. So there is deliberately no
      # frontend build above `clippy`/`test`, which compile mnema-desktop and do
      # not need it. This step earns its place as the cheap, early gate on the
      # frontend itself — a broken `vite build` or a svelte-check failure —
      # which would otherwise surface only in the far heavier macOS bundle job.
      #
      # A runner image ships a `node` already, but which version is exactly the
      # drift `rust-toolchain.toml` and this file's pinned actions exist to
      # avoid, so it is provisioned explicitly. `lts/*` tracks the current LTS
      # line instead of a number that goes stale on its own.
      - name: Node.js, for building and testing the Svelte frontend
        if: runner.os == 'Linux'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      # `npm ci`, not `npm install`: it builds from the committed lockfile and
      # fails rather than silently resolving something new. `npm run build` is
      # `svelte-check && vite build` (ui/package.json), the type-check and the
      # production build in one; `npm run test` is Vitest, which `run build`
      # does not cover.
      - name: Build the Svelte frontend and run its unit tests
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix ui
          npm --prefix ui run build
          npm --prefix ui run test
      # mnema-extract binds to a prebuilt Pdfium library, which is not committed:
      # it is 7.7 MB and reproducible from a pinned, checksum-verified release.
      # The tests need it too — they fail on a missing library rather than on
      # anything they are about — and the step that fetches it now runs further
      # up, because compiling `src-tauri` needs it as well. Both platforms in the
      # matrix have a pin in that script; Linux was added for this matrix.
      - run: cargo test --workspace
      # `cargo test --workspace` above skips mnema-secrets' one `#[ignore]`d
      # test, and that test is the only thing that checks the platform binding
      # actually works — everything else in that crate runs against an in-memory
      # store. Left unrun, a break in the macOS keychain path would reach a
      # release before anything noticed.
      #
      # It is safe to run here because `apple-native-keyring-store` resolves its
      # keychain through `SecKeychain::default_for_domain(User)`, which is
      # exactly what `security default-keychain -s` sets. Pointing that at a
      # throwaway file exercises the real Keychain Services API without going
      # near a login keychain. Verified rather than assumed: with `forget`
      # disabled, the credential was found in the throwaway keychain and the
      # login keychain was empty.
      #
      # The `#[ignore]` stays. A plain `cargo test --workspace`, here or on a
      # developer's machine, must never touch a credential store.
      #
      # macOS only, and the condition is not a convenience: `security` is a
      # macOS binary, and the store this crate compiles on Linux is the D-Bus
      # Secret Service, which a runner has no session for. The Linux binding
      # stays unexercised — a gap task 7 recorded, not one this closes.
      #
      # Read this before trusting the quiet, because the quiet is newer than the
      # gap. Tests outside this crate that need a credential now register an
      # in-memory store of their own, so they are served by it on every platform.
      # That is deliberate and is the rule stated above. It also removes the one
      # way this gap could ever have spoken up by accident: a test reaching for a
      # credential without that store would fail on this leg, loudly and for the
      # right reason, because there is no session behind the binding it compiles
      # against. Such a test now passes, and the Linux binding goes untested
      # without a sound. A gap that could once have spoken and no longer can
      # needs the note more than one that was always silent.
      #
      # That sentence is worth more if you know which parts of it were run, so:
      # MEASURED, on macOS with the platform store forced to fail — a test that
      # reaches a credential without the in-memory store fails, and the message
      # names the reference it was for and says the store could not be reached
      # (`Unavailable { reference, detail }`), so the failure would be loud and
      # legible rather than a puzzle. It does not say WHICH store; only
      # `NotPersistent` carries a vendor. INHERITED, from the sentence above
      # this one, which predates it: that a runner has no Secret Service
      # session. NEVER RUN ANYWHERE: the Linux store's own construction and the
      # error it produces. It compiles on this leg and is never constructed at
      # runtime, because nothing gets as far as calling it — which is the gap
      # itself, stated as what it is.
      #
      # Do not read what follows as a closed list; it is why no path arrives,
      # not a rule with two branches. A test may register a store of its own
      # first (the desktop fixture, `foreign_store.rs`, and this crate's unit
      # tests through `mock_store()`); it may be `#[ignore]`d (`roundtrip.rs`);
      # it may be turned back before a store is chosen at all
      # (`src-tauri/tests/commands.rs` passes an empty reference, which `entry`
      # rejects outright). And for this crate's own unit tests the platform
      # branch is not compiled in the first place: `platform_store` has a
      # `#[cfg(test)]` arm (`crates/mnema-secrets/src/lib.rs:313,320`).
      #
      # That last one is the one to know about, because it is the only thing
      # covering the single place in the workspace that calls `platform_store`
      # by name — `a_unit_test_cannot_reach_the_platform_store`, which is a
      # plain `#[test]`, is NOT ignored, and runs on this leg in every
      # `cargo test --workspace`. It matches none of the other three and still
      # constructs nothing. If you go looking for only "registers or ignored",
      # that test will look like uncovered ground, and it is not.
      #
      # What would close it — mirroring the step below rather than inventing a
      # shape: on ubuntu-24.04, run the same command inside `dbus-run-session`
      # with `gnome-keyring --unlock --components=secrets`, so `roundtrip` meets
      # a real Secret Service. Everything the step below argues carries over
      # unchanged: `--include-ignored` and never `--ignored`, for the reason
      # spelled out at its last line, and the `#[ignore]` itself stays.
      - name: Credential store, against a throwaway keychain
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mnema-ci.keychain-db"
          # Generated, not written down: this guards a file that lives for the
          # length of one step on a VM that is destroyed afterwards, and a
          # literal here would be a credential in the repository.
          PASSWORD="$(uuidgen)"
          # Trimmed, not stripped of every space: `tr -d ' '` would mangle a home
          # directory with a space in it and restore a path that does not exist.
          # Irrelevant on a runner, but this script is what someone pastes
          # locally to reproduce a failure, and there it is their keychain.
          ORIGINAL_DEFAULT="$(security default-keychain | sed -E 's/^[[:space:]]*"?//; s/"?[[:space:]]*$//')"
          # Both arms end in `|| true`: under `set -e` a failing first command
          # ends the trap, and the throwaway keychain would outlive the job.
          trap 'security default-keychain -s "$ORIGINAL_DEFAULT" || true; security delete-keychain "$KEYCHAIN" 2>/dev/null || true' EXIT
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"   # no auto-lock timeout
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # `--include-ignored`, never `--ignored`. `--ignored` selects *only*
          # ignored tests, so the day someone removes the attribute this step
          # runs zero tests and exits 0 — a green step certifying nothing, in the
          # one place that exists to prove the platform binding works. Measured:
          # with the attribute removed, `--ignored` reports "0 passed; 14
          # filtered out" and passes. `--include-ignored` runs it either way.
          #
          # Scoped to `--test roundtrip` so this stays the keychain step: the
          # rest of the crate's tests already ran under `cargo test --workspace`.
          cargo test -p mnema-secrets --test roundtrip -- --include-ignored
      # The start-up smoke test — the guard the unit suite structurally cannot
      # be. The app menu is built with `muda`, which must run on the real main
      # thread, so no `#[test]` (a worker thread) can build the app in-process;
      # that is why a build-time `app.path()` panic shipped green through
      # `cargo test --workspace` + every review — nothing there launches the app.
      # This launches the real binary and fails if it dies during start-up.
      #
      # macOS only: the app menu is a macOS surface, and launching needs a
      # display, which the runner session provides. `--include-ignored`, never
      # `--ignored`, for the reason the keychain step above spells out (a dropped
      # attribute would otherwise make it select zero tests and pass green).
      #
      # First-run note: this is the one step whose environment (a GUI-capable
      # runner session) could not be verified before merge; if the runner cannot
      # bring up a window, fall back to running it locally / from the pre-push
      # hook rather than weakening it into a non-blocking step.
      - name: App start-up smoke test (launches the real binary)
        if: runner.os == 'macOS'
        run: cargo test -p mnema-desktop --test launch_smoke -- --include-ignored

  mutations:
    # The instrument that proves a test is load-bearing. It ran by hand only
    # until now, which meant it protected exactly as much as someone
    # remembered to protect.
    #
    # No `needs:`. Every job here starts from a bare checkout and provisions
    # itself, so the only thing `needs: check` ever bought was declining to
    # spend runner minutes on a commit that would not compile — and on a public
    # repository those minutes are free. What it cost was the whole of `check`
    # in front of the longest job in the workflow, on every run. Serialising to
    # save nothing is how a slow gate becomes one people work around.
    runs-on: ubuntu-24.04
    # Thirty was a guess when this leg was written, and it stayed one until the
    # leg first executed: pull request #7, **6m17s, green** — five times the
    # margin, on the 119 cases this step ran then.
    #
    # ⚠️ **Measured since, and the margin is about three times.** Run
    # 33235659149 (`2e0880e`): staleness 9s, the harness step **9m52s**, green.
    # The paragraph below was written before that run and is kept because its
    # reasoning is what the number confirmed — but its case count was already
    # wrong when it was written (161 against 163 in the files), and every
    # number written here since has gone stale within a round or two: 170 while
    # the files held 175, and this comment was last repaired two commits before
    # it was wrong again. So no count is asserted here as a present fact. This
    # is how to count, and it is the sentence to trust:
    #
    #   cat scripts/mutations/{source,embedding,pr8-exclusions,pr8-subfolders,pr8-subfolders-linux,pr8-ui-folders}.sh | grep -c '^case_ '
    #
    # That command answered **179** at fix round 2 of PR 8a — a reading of that
    # tree, not a property of this file, and it is expected to have moved by the
    # time anybody reads this. Run it.
    #
    # The ones added since the 9m52s run are `pr8-ui-folders.sh`'s (count them
    # with `grep -c '^case_ ' scripts/mutations/pr8-ui-folders.sh`), and they
    # are the cheapest in the directory: they compile nothing and run one vitest
    # test each — **13.8s for the whole file** on an Apple M2 Max, including the
    # worktree and the dependency links. Even at four times that on the runner
    # it is a minute against a limit with eighteen to spare.
    #
    # The paragraph as written, which the 9m52s confirmed:
    # The step below then named 161 cases, and the new 42 are not like the old
    # 119: they mutate `src-tauri` and `mnema-walk` and re-run `--test
    # commands`, the slowest target in the workspace, while `source.sh` and
    # `embedding.sh` mutate leaf crates. Scaling 6m17s by case count is
    # therefore wrong in both directions at once — it also scales a fixed
    # setup (checkout, toolchain, apt, sidecar, Pdfium, the first build) that
    # does not grow with cases. The only number anybody has for the new half is
    # **5m21s for those 42 cases on a warm developer machine**, which is not
    # this runner and bounds nothing here; it does say the per-case model
    # under-counts by roughly 2.4x. So: this limit is expected to hold with
    # room, and the first run after this change is what turns that into a
    # measurement. Raise it from that run if it wants raising, not from a
    # feeling and not from the arithmetic above.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # **First, and before anything is provisioned**, because it needs nothing
      # provisioned: no toolchain, no sidecar, no Pdfium, about a second for the
      # whole directory. A case file that has stopped applying should fail this
      # job before two minutes of setup, not after.
      #
      # It answers the question the step at the bottom cannot. That one runs ONE
      # case file and proves its tests still go red; this reads every file in
      # `scripts/mutations/` and asks whether the cases still match the code they
      # were written against. On the branch this was added on, three cases in two
      # files had stopped applying — one of them behind the very test cited as proof a
      # repair was still pinned — and nothing else was looking: `branch-review.sh`
      # is a case file like any other and was clean while they rotted.
      #
      # ⚠️ **This line used to say "all twenty-four", and no number belongs
      # here** (fix round 2, B7): the directory holds 41 `.sh` files and the
      # sweep reports 34 of them as case files, the other 7 being stand-in
      # workers that declare an interpreter — both figures as of fix round 2 of
      # PR 8a, both moving, and neither worth trusting from a comment. The run's
      # own last two lines print the second one every time, and the first is
      # `ls scripts/mutations/*.sh | wc -l`.
      #
      # No argument, so it sweeps every file. The single-file form exists and is
      # deliberately not what runs here: a green line about one file gets read as
      # a green line about the directory, which is exactly how those three
      # survived a full branch review.
      #
      # What it needs on the runner: `perl`, `head`, `basename` and `mktemp`, all
      # of which the harness step below already depends on, plus `cmp` — the one
      # addition, from diffutils, present on every image this workflow uses.
      # Two more that need nothing provisioned, for the same reason. The
      # first fails on any obligation written into a comment as the word BOOKED
      # in capitals followed by an opening parenthesis (the form is not spelled
      # out here, because this file is swept too — the first draft of this
      # comment was the sweep's first finding): PR 8b shipped two promises that
      # lived only in a comment and were never done, and this is what makes
      # such a promise a red line instead of a note. The second is
      # `check-citations.sh`, which proves every `file:line` written in a comment
      # lands inside its file — never that it names the right line, which is a
      # reader's call. Its ruling in D137 that
      # it could not be wired in because a stale citation would make it red was
      # withdrawn there: it exits 0 over the whole tree, and this is the line
      # that keeps it so. Its output is the sweep's own reading matter and is
      # long (2 700 lines), so only the problem list it prints last is shown,
      # and only when it fails — a red step with no output would send whoever
      # reads it back to a local run to learn which citation moved.
      - name: Check that no obligation is still written into the code
        run: scripts/check-booked.sh
      - name: Check that every source citation lands inside its file
        run: |
          scripts/check-citations.sh > "$RUNNER_TEMP/citations.txt" \
            || { grep -A 200 'mechanical problem' "$RUNNER_TEMP/citations.txt" \
                 || tail -n 20 "$RUNNER_TEMP/citations.txt"; exit 1; }
      - name: Check that every mutation case still applies
        run: scripts/mutation-staleness.sh
      - name: Provision the toolchain named in rust-toolchain.toml
        run: rustup toolchain install
      # The harness's own worktree only carries vendor/ and
      # src-tauri/binaries/ if this checkout already has them
      # (mutation-check.sh:159, :177-178) — both are git-ignored, so a case
      # touching mnema-desktop needs the same setup `check` uses to build it
      # at all.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Stage the extraction worker that src-tauri declares as a sidecar
        run: scripts/stage-sidecar.sh debug
      - name: Vendor the pinned Pdfium build, which src-tauri now needs to compile
        run: scripts/fetch-pdfium.sh
      # For `pr8-ui-folders.sh` and nothing else in this job: its cases run
      # vitest, and `mutation-check.sh` links `ui/node_modules` into its
      # worktree rather than installing there, so the directory has to exist in
      # this checkout first. Same `lts/*` and same `npm ci` as `check` — the
      # lockfile, not a fresh resolution.
      #
      # `npm run build` and `npm run test` are deliberately NOT repeated here:
      # `check` already runs both, and this job needs the dependency tree, not a
      # second opinion about the frontend.
      #
      # Measured cost on run 33235659149 (`2e0880e`, this branch's merge-base),
      # from `check (ubuntu-24.04)`: setup-node **1s**, and the step that runs
      # `npm ci` **plus** `npm run build` **plus** `npm run test` took **20s**
      # end to end — so `npm ci` alone is under twenty seconds. That is a
      # measurement of the same commands on the same runner image, not this
      # job's own number, which the first run after this change will produce.
      - name: Node.js, for the mutation cases that run vitest
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - name: Install the frontend dependencies the vitest cases run against
        run: npm ci --prefix ui
      # ⚠️ **This list is not every case file, and the omission is a decision
      # rather than an oversight.** `scripts/mutation-staleness.sh` above
      # sweeps all of them and proves each case still APPLIES; this step proves
      # a case still KILLS, and only for what is named here. A file left out is
      # local evidence and nothing more — which is what PR 8a's four files were
      # until now, and what `source.sh`/`embedding.sh` alone made this step's
      # old name ("this cycle's mutation cases") untrue two cycles ago.
      #
      # ⚠️ **`pr8-exclusions-macos.sh` is deliberately absent and cannot be
      # added here.** This job is `runs-on: ubuntu-24.04` with no matrix, and
      # that file's one case names a `#[cfg(target_os = "macos")]` test; off
      # macOS the harness's baseline `--exact` selects nothing, reads
      # `0 passed`, and exits 1 for the whole file. Running it needs a macOS
      # mutations leg, which is a separate decision about runner minutes — see
      # that file's own header. `pr8-subfolders-linux.sh` is the mirror case
      # and belongs HERE for the same reason it cannot run on macOS.
      #
      # `pr8-ui-folders.sh` has no such split and needs none: its tests run in
      # jsdom, nothing in them is behind a platform condition, and the whole
      # file is green on this leg. What it does need is the two steps above —
      # a case whose runner is not installed fails its baseline for a reason
      # that is not the mutation, which is the same defect the vendored
      # libraries and the staged sidecar are copied into the worktree to avoid.
      - name: Run the mutation cases named below
        run: |
          scripts/mutation-check.sh scripts/mutations/source.sh
          scripts/mutation-check.sh scripts/mutations/embedding.sh
          scripts/mutation-check.sh scripts/mutations/pr8-exclusions.sh
          scripts/mutation-check.sh scripts/mutations/pr8-subfolders.sh
          scripts/mutation-check.sh scripts/mutations/pr8-subfolders-linux.sh
          scripts/mutation-check.sh scripts/mutations/pr8-ui-folders.sh

  bundle:
    # One architecture per package rather than a universal binary: a universal
    # build carries both slices, so every user downloads roughly twice the
    # application they can run. Measured, not assumed — the numbers are in
    # docs/BUILD.md. macos-14 is arm64, which is what the artefact name claims.
    #
    # No `needs:`, for the reason written above `mutations`.
    runs-on: macos-14
    # 1.4–2.1 minutes across the same three runs. The limit is here for the same
    # reason as the one on `check`, and it matters slightly more: this job is the
    # one that produces the download, so a wedged run leaves someone waiting on
    # an artefact that is never coming, with the job still showing as running.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision the toolchain named in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # A version range rather than a pinned build: the CLI has to agree with the
      # `tauri` crate the workspace compiles, and that agreement is a major
      # version on both sides. `--locked` keeps the CLI's own dependency
      # resolution from drifting between runs.
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      # This step used to be absent, with a comment explaining that the bundle
      # linked Pdfium and loaded it nowhere. A reader lands and that inverts: the
      # library is now `bundle.resources` in tauri.conf.json, so `cargo tauri
      # build` reads it out of vendor/ and packages it, and without this step the
      # build fails on a missing resource rather than producing a bundle that
      # cannot read a PDF. Which of those two it fails as is the point — the old
      # comment's reasoning ("nothing in the image loads it") was true right up
      # until it silently was not, and the check below is what noticed.
      - name: Vendor the pinned Pdfium build, which the bundle now ships
        run: scripts/fetch-pdfium.sh
      # `cargo tauri build` runs beforeBuildCommand (scripts/before-build.sh),
      # which does `npm ci` and `npm run build` to produce the ui/dist this
      # bundle embeds — so it needs a node, provisioned explicitly for the same
      # reason the check job's is rather than trusting whatever the image ships.
      # Unlike check's frontend gate this is not optional: without the build
      # there is no frontend to package. `lts/*` matches the check job.
      - name: Node.js, for the frontend the bundle embeds
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - run: cargo tauri build
      # Never `|| true`, never a grep whose failure is swallowed. The script
      # opens the .dmg and looks at the application inside it; every state it
      # rejects is produced on purpose by scripts/verify-bundle-controls.sh,
      # which also requires the real image to pass. That script is the list —
      # repeating one here is how the count came to disagree across three
      # documents the first time.
      #
      # It looks inside the image because `target/release/bundle/macos/` is empty
      # after the build: with targets ["dmg"] the bundler prints
      # `Cleaning …/Mnema.app` once the image is written.
      - name: The bundle exists, is signed, and its own worker answers for what is in it
        run: scripts/verify-bundle.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mnema-macos-arm64
          path: target/release/bundle/dmg/*.dmg
          # Not the default. `if-no-files-found` defaults to `warn`, so a run
          # that produced no .dmg — or produced one under a path this glob does
          # not match, which is what `--target universal-apple-darwin` does —
          # uploads nothing, prints a warning and leaves the job green. That is
          # this repository's signature defect, a step that passes while doing
          # nothing, sitting in the one job whose whole purpose is to prove a
          # package gets built.
          if-no-files-found: error
