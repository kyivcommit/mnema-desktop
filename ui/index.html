<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Mnema</title>
    <!--
      A placeholder, and the walking skeleton's far end: enough of it to walk
      the whole path — open the index, add a folder, run a real walk, search
      it — by hand. Not every command in `invoke_handler!`
      (`src-tauri/src/lib.rs`) has a control here yet; `skips` and
      `remove_watched_folder` do not. The interface ported from the server
      repository replaces this file rather than growing it further.

      Script and styles are separate files rather than inline. The CSP is
      `default-src 'self'`, under which an external file is unambiguously
      allowed; an inline script depends on Tauri's nonce injection, and the
      React build produces external files anyway.
    -->
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Mnema</h1>
      <p id="index-status" class="muted">opening the index…</p>

      <section>
        <h2>Lexical search</h2>
        <form id="search-form">
          <input id="query" type="search" placeholder="query" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
        <p id="search-status" class="muted">nothing searched yet</p>
      </section>

      <section>
        <h2>Watched folder</h2>
        <!--
          A text field, not a native picker: a folder-choosing dialog needs
          its own plugin and, with it, a changed ACL — the interface spec's
          decision, not this task's, and the same seam D48 found a Windows
          origin trap in once already. A path typed here is enough to
          exercise `add_watched_folder` end to end.
        -->
        <form id="folder-form">
          <input id="folder-path" type="text" placeholder="/path/to/folder" autocomplete="off" />
          <button type="submit">Add folder</button>
        </form>
        <p id="folder-status" class="muted">no folder added yet</p>
      </section>

      <section>
        <h2>Walk job</h2>
        <button id="start">Start</button>
        <button id="cancel" disabled>Cancel</button>
        <progress id="bar" value="0" max="1"></progress>
        <p id="job-status" class="muted">idle</p>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
