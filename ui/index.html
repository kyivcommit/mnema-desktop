<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Mnema</title>
    <!--
      The walking skeleton's far end, reached by hand: open the index, pick a
      real folder through the OS's own dialog, watch a real walk run over it,
      and read back a cited hit. The interface ported from the server
      repository replaces this file rather than growing it further.

      Script and styles are separate files rather than inline. The CSP is
      `default-src 'self'`, under which an external file is unambiguously
      allowed; an inline script depends on Tauri's nonce injection, and the
      React build produces external files anyway.
    -->
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Mnema</h1>
      <p id="index-status" class="muted">opening the index…</p>

      <!--
        One job area, because there is one job. `AppState::running` is a single
        flag for the whole application: embedding cannot run beside a walk, so
        both start buttons draw on the same bar, write to the same status line
        and are stopped by the same Cancel. Two bars would suggest two jobs, and
        a second Cancel would be a button that stops whichever job happens to be
        running rather than the one it sits beside.

        "Embed" is not disabled by the absence of a folder the way "Index it"
        is: it works off what the index already holds, not off a folder chosen
        in this window, and it stays pressable after a reload that lost the
        chosen folder. What it does need — a key and a chosen model — it does
        not gate on either, because a refusal that names what is missing is
        better than a button that is dead for a reason nobody can see.
      -->
      <section>
        <h2>Watched folder</h2>
        <button id="pick">Choose a folder…</button>
        <p id="folder" class="muted">no folder chosen</p>
        <button id="walk" disabled>Index it</button>
        <button id="embed">Embed what is indexed</button>
        <button id="cancel" disabled>Cancel</button>
        <progress id="bar" value="0" max="1"></progress>
        <p id="job-status" class="muted">idle</p>
        <p id="skips" class="muted"></p>
      </section>

      <!--
        Two facts are never given one element. `key-state` is what the
        credential store says right now and is redrawn from `model_settings`;
        `key-status` is the outcome of the last thing the person pressed and
        must survive that redraw. Each picker likewise has two lines under it:
        `-unreadable` is about the provider's list, `-missing` is about the
        model this index has recorded — a single element would let whichever
        was written second erase the other.
      -->
      <section>
        <h2>Models</h2>
        <p id="disclosure"></p>
        <form id="key-form">
          <input id="key" type="password" placeholder="OpenRouter key" autocomplete="off" />
          <!--
            The placeholder and the label below are both redrawn from the
            credential store's own answer (`keyFieldPlaceholder`,
            `keySubmitText`): with a key stored, this window clears the field
            after saving it, so an empty field is the ordinary state and the
            markup must not read as though something were missing. The values
            here are what a person sees before the first `model_settings`
            answers, and they are the neutral pair for the same reason the
            `notAsked` arm is.
          -->
          <button id="key-submit" type="submit">Check and save</button>
          <button id="forget" type="button">Remove the key</button>
        </form>
        <p id="key-state" class="muted"></p>
        <p id="key-status" class="muted"></p>
        <!--
          Empty on two of the three platforms and with no key stored, and filled
          from `keyStoreNote`. It says what macOS will ask for after an update,
          before it asks — the request comes from an application the system
          cannot vouch for, and somebody meeting it cold should refuse it.
        -->
        <p id="key-note" class="muted"></p>
        <label>Embeddings <select id="embedding-model"></select></label>
        <p id="embedding-model-unreadable" class="muted"></p>
        <p id="embedding-model-missing" class="muted"></p>
        <!--
          The only control in this window that destroys anything, and it is
          hidden until a model change has actually been refused. Its label is
          never "are you sure?": it carries the number of embeddings the change
          would delete, because that number is what is being spent. Whether it
          can be shown at all is `discardOffer`'s decision, and it says no when
          this window cannot state the number.
        -->
        <button id="discard-vectors" type="button" hidden></button>
        <p id="discard-vectors-note" class="muted"></p>
        <label>Reranking <select id="rerank-model"></select></label>
        <p id="rerank-model-unreadable" class="muted"></p>
        <p id="rerank-model-missing" class="muted"></p>
        <label>Answers <select id="chat-model"></select></label>
        <p id="chat-model-unreadable" class="muted"></p>
        <p id="chat-model-missing" class="muted"></p>
        <p id="model-status" class="muted"></p>
        <p id="index-state" class="muted"></p>
        <p id="embedding-progress" class="muted"></p>
      </section>

      <section>
        <h2>Search</h2>
        <!--
          An exception to this file's own header, which asks not to be grown
          further: these two toggles are temporary and leave with this file
          once the ported interface arrives.
        -->
        <label><input id="arm-text" type="checkbox" checked /> Search by text</label>
        <p id="arm-text-note" class="muted"></p>
        <label><input id="arm-content" type="checkbox" checked /> Search by content</label>
        <p id="arm-content-note" class="muted"></p>
        <form id="search-form">
          <input id="query" type="search" placeholder="query" autocomplete="off" required />
          <!--
            §3.3 of the round-3 readiness-barrier spec: this starts disabled
            rather than relying on `main.js` to disable it before anything
            can be pressed. There is a window, at every load, between the
            markup parsing and the first `model_settings` read landing, that
            no handler-side guard can close — `main.js`'s own barrier
            (`syncSearchGate`) only ever narrows this further, and opens it
            once the first authoritative read has drawn.
          -->
          <button id="search-submit" type="submit" disabled>Search</button>
        </form>
        <p id="text-arm-state" class="muted"></p>
        <p id="content-arm-state" class="muted"></p>
        <ol id="results"></ol>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
