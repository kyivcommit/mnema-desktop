[package]
name = "mnema-desktop"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# A library plus a thin binary, not a binary alone. Integration tests cannot
# `use` a bin-only crate, and the shell is exactly the layer where a test has to
# reach the command functions and the IPC handler from outside.
[lib]
name = "mnema_desktop"
path = "src/lib.rs"

[[bin]]
name = "mnema-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mnema-index = { path = "../crates/mnema-index" }
# The orchestration crate. It brings `mnema-pool` and `mnema-chunk` with it and
# NOT `mnema-extract`: the worker's output crosses as `mnema_core::Block`, so
# the Pdfium binding stays outside this graph. `tests/dependency_boundary.rs`
# is what says so rather than this comment.
mnema-ingest = { path = "../crates/mnema-ingest" }
# `walk_root`'s own signature — `Coordinate` on `Citation`, `Pool` and
# `WalkRules` on `walk_root` itself — names types from these three crates
# without re-exporting them, so naming them here is what lets `bridge.rs` and
# `walk_job.rs` write the types rather than only pass them through untouched.
# None of the three is new to the graph: `mnema-ingest` already brings all of
# them in transitively, and `tests/dependency_boundary.rs` is what proves that
# adding them by name changes nothing it checks.
mnema-core = { path = "../crates/mnema-core" }
mnema-pool = { path = "../crates/mnema-pool" }
mnema-walk = { path = "../crates/mnema-walk" }
# The provider protocol. Brings `ureq` and a TLS stack, and nothing that
# `tests/dependency_boundary.rs` forbids — checked by running it, not by
# reading. This is the first TLS stack in the application's graph.
mnema-provider = { path = "../crates/mnema-provider" }
# The OS credential store. The key lives here and never in the database (D33).
mnema-secrets = { path = "../crates/mnema-secrets" }
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-dialog = "2"
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# `test` brings in the mock runtime. Declared here rather than as a feature of
# the crate so the shipped binary can never contain it.
tauri = { version = "2.11", features = ["test"] }
# What `tauri-build` reads tauri.conf.json with. `tests/vendored_library_resource.rs`
# asks it for the Linux and Windows configurations while running on macOS, which
# is the only way one host can see the platform-file merge every other host gets.
# Reimplementing that merge in the test would check the reimplementation.
#
# Already in the tree — `tauri` and `tauri-build` both depend on it — and a
# dev-dependency at that, so `tests/dependency_boundary.rs` is unaffected: it
# asks `cargo tree -e normal`, which excludes dev- and build-dependencies.
tauri-utils = "2.9"
# The same mock server the provider crate's own tests use — one server, not two
# copies that drift.
mnema-mock-provider = { workspace = true }
# The same crate as the `[dependencies]` entry above, with the store these tests
# register. Without it every command touching a credential would reach the
# developer's real login keychain, and would fail outright on a runner that has
# no unlocked keychain and no Secret Service session — which is why
# `.github/workflows/ci.yml` forbids `cargo test --workspace` from touching a
# credential store at all. Enabling a feature from `[dev-dependencies]` does not
# enable it for `cargo build`, so nothing here reaches a shipped binary.
mnema-secrets = { path = "../crates/mnema-secrets", features = ["test-store"] }
# For the one value a model configuration needs that is neither the model's name
# nor its width. A dev-dependency, so `tests/dependency_boundary.rs` — which
# asks `cargo tree -e normal` — is unaffected; the crate is already in the graph
# transitively through `mnema-ingest` in any case.
mnema-chunk = { path = "../crates/mnema-chunk" }
serde_json = { workspace = true }
tempfile = { workspace = true }
