[package]
name = "mnema-ingest"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The orchestration crate: the only place that knows the order of operations.
# It exists because the alternative did not compile. The plan put `ingest.rs`
# inside `mnema-index`, and `mnema-pool` already depends on `mnema-index` (for
# `SkipRule`, so that `impl From<Failure> for SkipRule` can live on the pool
# side) — an ingest module inside the index crate would need the pool back, and
# cargo rejects the cycle. Splitting it out keeps `mnema-index` a storage
# crate, `mnema-pool` a supervision crate and `mnema-chunk` a pure function.
#
# It does NOT reach `mnema-extract`: everything it needs from the worker
# arrives as `mnema_core::Block` through the pool, which is what keeps the
# Pdfium binding out of the application's dependency graph
# (`src-tauri/tests/dependency_boundary.rs`).
[dependencies]
mnema-core = { path = "../mnema-core" }
mnema-index = { path = "../mnema-index" }
mnema-pool = { path = "../mnema-pool" }
mnema-chunk = { path = "../mnema-chunk" }
# `walk.rs`'s `enumerate`, `WalkRules`, `Found`, `PreSkipRule` — this crate is
# the only one that knows the order phases run in (see the module doc above),
# and joining a walk to `ingest_file` is that order, one level up. Used to be
# a `[dev-dependencies]`-only entry (`mnema_walk::stat`, for `tests/` to model
# the walk's own measurement); it moved here rather than staying duplicated in
# both sections once `src/walk.rs` needed it too.
mnema-walk = { path = "../mnema-walk" }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `tests/randomised.rs` only. `document.id` is the sha256 of a file's bytes, so
# a harness that wants to ask "is the index still holding what this file
# actually contains?" has to be able to compute one itself — reading the answer
# back out of the index would be the index marking its own work.
sha2 = { workspace = true }
# `tests/randomised.rs` only, and at the pin the whole workspace already
# resolves (`crates/mnema-deps-probe/Cargo.toml:8`, `mnema-extract`'s own
# dependency). Four of the five formats the harness now generates are zip
# containers, and the generator has to build them the way a producer does —
# writing the bytes by hand would make the fixtures a second implementation of
# the archive format, which is the thing they are supposed to be independent of.
#
# `default-features = false` + `deflate` for the reason the probe states, though
# every archive this harness writes is STORED: see `zip_of`, where the reason is
# an invariant rather than a preference.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
