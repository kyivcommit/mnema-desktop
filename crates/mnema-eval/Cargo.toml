[package]
name = "mnema-eval"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The instrument that judges search. Not part of the bundle: nothing in
# `src-tauri` depends on it, and nothing here may be depended on by shipping
# code. It is allowed to know about the whole pipeline precisely because it
# ships nowhere.
#
# No `rusqlite` here, deliberately, on the rule `mnema-embed` states: everything
# from the database arrives through `Db`'s own methods.
[dependencies]
mnema-core = { path = "../mnema-core" }
mnema-index = { path = "../mnema-index" }
mnema-ingest = { path = "../mnema-ingest" }
mnema-pool = { path = "../mnema-pool" }
mnema-walk = { path = "../mnema-walk" }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
