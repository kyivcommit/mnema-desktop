[package]
name = "mnema-deps-probe"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dev-dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
calamine = "0.36"
chardetng = "1"
encoding_rs = "0.8"
ignore = "0.4.31"
comrak = "0.54"
scraper = "0.27"
html5ever = "0.39"
# Correction to G7.0 §8: the 0.12 feature `rustls-tls` no longer exists; the
# backend is now `rustls`. Do NOT also ask for `rustls-native-certs` — 0.13.2
# dropped that optional dependency in favour of rustls-platform-verifier, and
# asking for it makes cargo silently resolve back to 0.13.1 instead of failing.
# `rustls` alone brings the platform verifier, i.e. the OS trust store, which is
# what we wanted anyway: the audience sits behind corporate TLS proxies whose CA
# exists only there.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }
keepawake = "0.6"
tempfile = { workspace = true }
