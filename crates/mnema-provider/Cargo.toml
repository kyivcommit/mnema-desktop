[package]
name = "mnema-provider"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The provider protocol and nothing else. No `mnema-index` and no
# `mnema-secrets`, deliberately: the key arrives as a parameter and the database
# never arrives at all, so this crate can be exercised without either. The same
# rule `mnema-chunk` keeps for the chunker.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
